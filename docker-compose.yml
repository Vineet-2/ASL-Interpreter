version: '3.8'

services:
  asl-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asl_conversation_assistant
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ASL_CITIZEN_VIDEOS=/dataset/videos
    volumes:
      - ./saved_models:/app/saved_models
      - ./extracted_landmarks:/app/extracted_landmarks
    restart: unless-stopped
